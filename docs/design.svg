<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1010" viewBox="0 0 1500 1010" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- ultimate packet inspector, how the pieces connect -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0c18"/>
      <stop offset="1" stop-color="#17141f"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#6cb4f0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box { fill: #67bb7e; stroke: #8ee39f; stroke-width: 2.5; }
      .cmd { fill: #67bb7e; stroke: #8ee39f; stroke-width: 2.5; stroke-dasharray: 7 5; }
      .title { fill: #fff; font-size: 17px; font-weight: 600; }
      .tag { fill: #123a1e; font-size: 12.5px; font-weight: 600; }
      .text { fill: #fff; font-size: 13.5px; white-space: pre; }
      .label { fill: #fff; font-size: 14px; }
      .big { fill: #fff; font-size: 21px; }
      .arrow { fill: none; stroke: #6cb4f0; stroke-width: 2.5; stroke-linecap: round; marker-end: url(#arrow); }
      .region { fill: none; stroke: #ffffff33; stroke-width: 1.5; stroke-dasharray: 7 7; }
      .muted { fill: #ffffff99; font-size: 13px; }
    </style>
  </defs>

  <rect width="1500" height="1010" fill="url(#bg)"/>

  <text x="750" y="72" text-anchor="middle" fill="#fff" font-size="34" font-weight="700">ultimate packet inspector design</text>
  <text x="750" y="110" text-anchor="middle" fill="#fff" font-size="20">(how the pieces connect - for when i forget)</text>

  <!-- ===== your mac: the agent ===== -->
  <rect class="region" x="38" y="148" width="642" height="782" rx="14"/>
  <text class="big" x="60" y="182">your mac - the agent (go)</text>
  <text class="muted" x="60" y="206">the boxes are goroutines started by upi run - they only talk to each other over channels</text>

  <rect class="box" x="60" y="226" width="250" height="124" rx="3"/>
  <text class="title" x="78" y="254">capture</text>
  <text class="tag" x="78" y="274">1 goroutine</text>
  <text class="text" x="78" y="298">reads packet headers off en0</text>
  <text class="text" x="78" y="318">(libpcap) + decodes them without</text>
  <text class="text" x="78" y="338">allocating. payloads stay here</text>

  <rect class="box" x="60" y="394" width="250" height="144" rx="3"/>
  <text class="title" x="78" y="422">match</text>
  <text class="tag" x="78" y="442">1 goroutine</text>
  <text class="text" x="78" y="466">looks each packet's addresses +</text>
  <text class="text" x="78" y="486">ports up in the connection index.</text>
  <text class="text" x="78" y="506">no match yet? it waits a moment</text>
  <text class="text" x="78" y="526">for that connection to show up</text>

  <rect class="box" x="60" y="582" width="250" height="144" rx="3"/>
  <text class="title" x="78" y="610">state</text>
  <text class="tag" x="78" y="630">the main goroutine - one select loop</text>
  <text class="text" x="78" y="654">owns every connection, endpoint,</text>
  <text class="text" x="78" y="674">packet (8 bytes each) + process's</text>
  <text class="text" x="78" y="694">cpu, memory and disk. nothing</text>
  <text class="text" x="78" y="714">else touches it, so no locks</text>

  <rect class="box" x="60" y="770" width="250" height="144" rx="3"/>
  <text class="title" x="78" y="798">broadcast</text>
  <text class="tag" x="78" y="818">1 goroutine + an http server</text>
  <text class="text" x="78" y="842">keeps the last 26h: connections,</text>
  <text class="text" x="78" y="862">endpoints, per-minute traffic.</text>
  <text class="text" x="78" y="882">never waits on a viewer - one</text>
  <text class="text" x="78" y="902">that falls behind is dropped</text>

  <rect class="box" x="400" y="226" width="262" height="222" rx="3"/>
  <text class="title" x="418" y="254">connection index</text>
  <text class="tag" x="418" y="274">2 goroutines + a C dispatch queue</text>
  <text class="text" x="418" y="298">C, through cgo, asks macOS's</text>
  <text class="text" x="418" y="318">NetworkStatistics for every flow</text>
  <text class="text" x="418" y="338">(QUIC + root's too). it calls back</text>
  <text class="text" x="418" y="358">on a dispatch queue; one goroutine</text>
  <text class="text" x="418" y="378">waits for those, one rebuilds the</text>
  <text class="text" x="418" y="398">index + swaps it in with an atomic</text>
  <text class="text" x="418" y="418">pointer. no NetworkStatistics? a</text>
  <text class="text" x="418" y="438">libproc socket scan every 2s</text>

  <rect class="box" x="400" y="548" width="262" height="164" rx="3"/>
  <text class="title" x="418" y="576">enrich</text>
  <text class="tag" x="418" y="596">6 goroutines: 4 lookup, 2 trace</text>
  <text class="text" x="418" y="620">once for each new address:</text>
  <text class="text" x="418" y="640">- name (tls, dns, reverse dns)</text>
  <text class="text" x="418" y="660">- place + network (DB-IP)</text>
  <text class="text" x="418" y="680">- owner + trackers (DuckDuckGo)</text>
  <text class="text" x="418" y="700">- traceroute + speed-of-light check</text>

  <rect class="cmd" x="400" y="770" width="262" height="104" rx="3"/>
  <text class="title" x="418" y="798">upi run -with-app</text>
  <text class="tag" x="418" y="818">how the app starts it</text>
  <text class="text" x="418" y="842">its own process. it stops when</text>
  <text class="text" x="418" y="862">the app's end of stdin closes</text>

  <!-- the packet path -->
  <path class="arrow" d="M185 350 L185 390"/>
  <text class="label" x="196" y="368">a packet</text>
  <text class="muted" x="196" y="384">chan, 8192 deep</text>
  <path class="arrow" d="M185 538 L185 578"/>
  <text class="label" x="196" y="556">packets + their process</text>
  <text class="muted" x="196" y="572">chan, in batches</text>
  <path class="arrow" d="M185 726 L185 766"/>
  <text class="label" x="196" y="744">every 2s (a ticker)</text>
  <text class="muted" x="196" y="760">chan, 64 batches deep</text>

  <!-- the connection index, read by match -->
  <path class="arrow" d="M400 430 L314 430"/>
  <text class="label" x="355" y="404" text-anchor="middle">every open</text>
  <text class="label" x="355" y="421" text-anchor="middle">connection</text>

  <!-- out to enrich and back -->
  <path class="arrow" d="M312 616 L396 616"/>
  <text class="label" x="355" y="606" text-anchor="middle">new address</text>
  <text class="muted" x="355" y="638" text-anchor="middle">queue,</text>
  <text class="muted" x="355" y="654" text-anchor="middle">1024 deep</text>
  <path class="arrow" d="M400 690 L316 690"/>
  <text class="label" x="355" y="712" text-anchor="middle">place, owner,</text>
  <text class="label" x="355" y="729" text-anchor="middle">route</text>

  <!-- ===== the local port ===== -->
  <text class="big" x="870" y="372" text-anchor="middle">a local port</text>
  <circle cx="870" cy="555" r="160" fill="#a9492b" stroke="#e46a3d" stroke-width="3"/>
  <text x="870" y="436" text-anchor="middle" fill="#fff" font-size="18" font-weight="600">127.0.0.1:7323</text>
  <text x="870" y="458" text-anchor="middle" fill="#ffffffcc" font-size="13.5">GET /events (server-sent events)</text>
  <text class="text" x="760" y="496">- on connect: a snapshot of</text>
  <text class="text" x="760" y="516">  everything the agent's kept</text>
  <text class="text" x="760" y="546">- then every 2s: the rows that</text>
  <text class="text" x="760" y="566">  batch changed</text>
  <text class="text" x="760" y="596">- loopback only. pages can read</text>
  <text class="text" x="760" y="616">  it if they're the app (or the</text>
  <text class="text" x="760" y="636">  dev server), nothing else</text>

  <!-- agent out -->
  <path class="arrow" d="M312 790 L366 790 C 384 790 384 741 402 741 L700 741 C 730 741 748 716 760 684"/>
  <text class="label" x="531" y="762" text-anchor="middle">each batch, once - however many apps</text>

  <!-- ===== the desktop app ===== -->
  <rect class="box" x="1192" y="232" width="250" height="76" rx="3"/>
  <text class="title" x="1210" y="260">you</text>
  <text class="text" x="1210" y="286">on this mac</text>

  <rect class="box" x="1152" y="430" width="330" height="230" rx="3"/>
  <text class="title" x="1170" y="458">desktop app</text>
  <text class="text" x="1170" y="484">wails - a window, nothing else. the</text>
  <text class="text" x="1170" y="504">page is web/ (vite + deck.gl)</text>
  <text class="text" x="1170" y="534">- overview: every process, ranked,</text>
  <text class="text" x="1170" y="554">  by any stat, with a chart</text>
  <text class="text" x="1170" y="580">- inspector: one process + its packets</text>
  <text class="text" x="1170" y="606">- map: the ascii world, routes,</text>
  <text class="text" x="1170" y="626">  packets moving along them</text>

  <path class="arrow" d="M1317 308 L1317 426"/>
  <text class="label" x="1328" y="372">opens it</text>

  <!-- port -> app -->
  <path class="arrow" d="M1030 540 C 1070 528 1110 524 1148 524"/>
  <text class="label" x="1090" y="494" text-anchor="middle">live updates</text>
  <text class="label" x="1090" y="511" text-anchor="middle">(EventSource)</text>

  <!-- app starts the agent -->
  <path class="arrow" d="M1152 640 C 1060 760 990 822 900 822 L666 822"/>
  <text class="label" x="910" y="850">starts the bundled upi when it opens,</text>
  <text class="label" x="910" y="868">unless one's already listening</text>

  <text class="muted" x="750" y="978" text-anchor="middle">the agent and the app are separate processes that only meet at the port - a frozen or slow window never holds up capture</text>

</svg>
